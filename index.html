<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relação de Itens</title>
<style>
  :root {
    --bg: #f2f2f2;
    --card-bg: #ffffff;
    --stripe: #d9d9d9;
    --text: #1a1a1a;
    --muted: #1f4e79;
    --accent: #538135;
    --accent-dark: #3c611f;
    --border: #c0c0c0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    position: sticky;
    top: 0;
    background: var(--accent);
    padding: 18px 16px;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(201, 111, 38, 0.25);
  }
  header h1 {
    margin: 0 0 12px;
    font-size: 20px;
    color: #ffffff;
    letter-spacing: 0.2px;
  }
  #search {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: #ffffff;
    color: var(--text);
  }
  #search::placeholder {
    color: #b99a7c;
  }
  #search:focus {
    outline: 2px solid var(--accent-dark);
    outline-offset: -1px;
  }
  #list {
    padding: 10px 12px 24px;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 4px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .item:nth-child(even) {
    background: var(--stripe);
  }
  .item:active {
    background: #c3dcae;
  }
  .item-code {
    font-size: 12px;
    color: var(--muted);
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .item-desc {
    font-size: 15px;
    line-height: 1.35;
    color: var(--text);
    font-weight: 600;
  }
  .item-thumb-flag {
    margin-left: auto;
    font-size: 18px;
    flex-shrink: 0;
    opacity: 0.8;
  }
  #empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
    display: none;
  }
  /* Overlay */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: none;
    flex-direction: column;
    z-index: 100;
  }
  #overlay.open {
    display: flex;
  }
  #overlay-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    color: #fff;
  }
  #close-btn {
    background: var(--accent);
    border: none;
    color: #fff;
    font-size: 22px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  #overlay-info {
    color: #fff;
    min-width: 0;
  }
  #overlay-code {
    font-size: 12px;
    color: var(--accent);
    font-weight: 700;
  }
  #overlay-desc {
    font-size: 15px;
    line-height: 1.3;
  }
  #overlay-imgwrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    overflow: hidden;
  }
  #overlay-imgwrap img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 8px;
  }
  #overlay-noimg {
    color: #9ca3af;
    text-align: center;
    padding: 24px;
    font-size: 15px;
  }
</style>
</head>
<body>

<header>
  <h1>Relação de Itens</h1>

  // ---- Fonte das fotos ----
  // "local": busca em img/<codigo>.<extensao> (pasta deste repositório)
  // "asp":   busca no servidor do TI, via ASP_URL_TEMPLATE (com fallback
  //          automático para a foto local se o ASP não tiver a imagem)
  const IMG_SOURCE = "asp";

  // Link do TI: http://servicos.giannini.com.br:8085/giannini/cadcons/imagem_produto.asp?cod_produto={codigo}
  // Esse link é HTTP e nosso site é HTTPS, então o navegador bloqueia a
  // imagem por "conteúdo misto". Por isso usamos o images.weserv.nl como
  // intermediário: ele busca a imagem no servidor do TI (HTTP) e reenvia
  // para o site de forma segura (HTTPS). Assim que o TI disponibilizar o
  // link em HTTPS, troque a linha abaixo pela URL direta do TI.
  const ASP_URL_TEMPLATE =
    "https://images.weserv.nl/?url=servicos.giannini.com.br:8085/giannini/cadcons/imagem_produto.asp%3Fcod_produto%3D{codigo}";

  const IMG_EXTENSIONS = ["png", "jpg", "jpeg", "webp"];

  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("empty");
  const searchEl = document.getElementById("search");
  const overlay = document.getElementById("overlay");
  const overlayCode = document.getElementById("overlay-code");
  const overlayDesc = document.getElementById("overlay-desc");
  const overlayImgwrap = document.getElementById("overlay-imgwrap");
  const closeBtn = document.getElementById("close-btn");

  function render(items) {
    listEl.innerHTML = "";
    emptyEl.style.display = items.length ? "none" : "block";
    for (const item of items) {
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <div>
          <div class="item-code">${item.codigo}</div>
          <div class="item-desc">${item.descricao}</div>
        </div>
        <div class="item-thumb-flag">📷</div>
      `;
      div.addEventListener("click", () => openItem(item));
      listEl.appendChild(div);
    }
  }

  function showNoImage() {
    overlayImgwrap.innerHTML = `<div id="overlay-noimg">Foto ainda não cadastrada para este item.</div>`;
  }

  function tryLoadLocalImage(codigo, extIndex = 0) {
    if (extIndex >= IMG_EXTENSIONS.length) {
      showNoImage();
      return;
    }
    const img = new Image();
    img.src = `img/${codigo}.${IMG_EXTENSIONS[extIndex]}`;
    img.alt = "Foto do item " + codigo;
    img.onload = () => {
      overlayImgwrap.innerHTML = "";
      overlayImgwrap.appendChild(img);
    };
    img.onerror = () => tryLoadLocalImage(codigo, extIndex + 1);
  }

  function tryLoadImage(codigo) {
    overlayImgwrap.innerHTML = "";

    if (IMG_SOURCE === "asp") {
      const img = new Image();
      img.src = ASP_URL_TEMPLATE.replace("{codigo}", codigo);
      img.alt = "Foto do item " + codigo;
      img.onload = () => {
        overlayImgwrap.innerHTML = "";
        overlayImgwrap.appendChild(img);
      };
      // Se o ASP falhar (rede fora da empresa, servidor fora do ar,
      // bloqueio por conteúdo misto http/https), cai para a pasta local.
      img.onerror = () => tryLoadLocalImage(codigo);
      return;
    }

    tryLoadLocalImage(codigo);
  }

  function openItem(item) {
    overlayCode.textContent = "Código " + item.codigo;
    overlayDesc.textContent = item.descricao;
    tryLoadImage(item.codigo);
    overlay.classList.add("open");
  }

  closeBtn.addEventListener("click", () => overlay.classList.remove("open"));
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) overlay.classList.remove("open");
  });

  searchEl.addEventListener("input", () => {
    const q = searchEl.value.trim().toLowerCase();
    const filtered = !q
      ? ITEMS
      : ITEMS.filter(
          (i) =>
            String(i.codigo).includes(q) ||
            i.descricao.toLowerCase().includes(q)
        );
    render(filtered);
  });

  render(ITEMS);
</script>
